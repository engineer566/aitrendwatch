# aitrendwatch 反代层基础安全响应头（MVP P1，2026-09-07）
# ------------------------------------------------------------------
# 用法（生产宿主 nginx，/opt/aitrendwatch 部署目录）：
#   1. 把本文件拷到宿主 nginx conf.d（或 /etc/nginx/snippets/security-headers.conf）
#   2. 在监听 aitrendwatch.top 的 server{} 内 include：
#        include /etc/nginx/snippets/security-headers.conf;
#   3. nginx -t && systemctl reload nginx（或 nginx -s reload）
#
# 注意：
#   - add_header 在 nginx 里有继承语义：在 server 级定义后，location 内若再出现
#     任何 add_header 会整体覆盖（丢失父级头）。若站点 location 已有 add_header
#     （如 CORS/缓存头），把下面 4 行也加进该 location，或只保留一处 server 级定义。
#   - Strict-Transport-Security 只应在全站 https 后开启；开启后浏览器会强制
#     https 一段时间，先确认无 http 明文入口残留。
#   - 本站模板内联 <style>/<script> + Google Analytics，开启严格 CSP 需同步改造
#     模板（nonce/外置），本轮先不做 CSP，避免误伤 GA 与主题首帧脚本。
#   - nginx 1.18（2020）建议随系统升级（apt 官方源或 nginx.org 主线），此处
#     头本身与版本无关。

# 强制 HTTPS（注意 HSTS preload 需申请，勿轻率 preload）
add_header Strict-Transport-Security "max-age=63072000" always;

# 禁止内容嗅探（防 text/plain 被当 HTML 执行）
add_header X-Content-Type-Options "nosniff" always;

# 禁止本站被第三方 iframe 嵌入（防点击劫持；同源内嵌无影响）
add_header X-Frame-Options "SAMEORIGIN" always;

# 外链/站内跳转只带来源（站点 URL，不带路径/查询），防敏感查询词泄给第三方
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 可选：限制浏览器特性（按需启用，勿影响业务 API）
# add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
