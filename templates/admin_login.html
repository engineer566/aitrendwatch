<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site_name }} · 管理后台登录</title>
<style>
  :root {
    --bg: #0f1117; --bg-card: #1a1d27; --border: #2a2f3c;
    --text: #e6e8ee; --text-dim: #8b91a3; --accent: #4f8cff;
    --accent-2: #ff5d8f; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; width: 360px; max-width: 90vw;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 14px; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 18px; width: 100%; padding: 10px; border-radius: 8px;
    border: none; background: var(--accent); color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  .err { color: var(--accent-2); font-size: 13px; margin-top: 12px; }
  .back { display: block; margin-top: 16px; text-align: center; font-size: 12px;
          color: var(--text-dim); text-decoration: none; }
  .back:hover { color: var(--accent); }
</style>
</head>
<body>
{% set q = request.args %}
<form class="card" method="post" action="/admin/login{% if q.next %}?next={{ q.next|urlencode }}{% endif %}">
  <h1>🛠 管理后台</h1>
  <p class="sub">请输入管理令牌（ADMIN_TOKEN）</p>
  <label for="token">令牌</label>
  <input type="password" name="token" id="token" autofocus required>
  <button type="submit">登录</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <a class="back" href="/">← 返回首页</a>
</form>
</body>
</html>
