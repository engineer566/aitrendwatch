<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site_name }} · 流量监控</title>
<script>
// 主题初始化须在 CSS 生效前执行，避免闪烁（key 与首页相同 → 主题跨页一致）
(function () {
  const saved = localStorage.getItem("aitw_theme");
  const sys = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = saved || sys;
})();
</script>
<style>
  /* ---- 设计 token（与首页 index.html 完全一致）---- */
  :root {
    --bg: #0f1117;
    --bg-card: #1a1d27;
    --bg-hover: #232734;
    --border: #2a2f3c;
    --text: #e6e8ee;
    --text-dim: #8b91a3;
    --accent: #4f8cff;
    --accent-2: #ff5d8f;
    --green: #3ecf8e;
    --orange: #ffa940;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --radius: 12px;
  }
  [data-theme="light"] {
    --bg: #f5f6f8;
    --bg-card: #ffffff;
    --bg-hover: #eef0f4;
    --border: #e3e6ec;
    --text: #1c2130;
    --text-dim: #6b7280;
    --accent: #3b76e1;
    --accent-2: #e0457a;
    --green: #18a568;
    --orange: #d9820f;
    --purple: #7c5ce0;
    --cyan: #0e9db8;
    --shadow: 0 1px 3px rgba(20,25,40,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
    transition: background .2s, color .2s;
  }
  .num { font-variant-numeric: tabular-nums; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 12px 24px;
  }
  .header-inner {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 {
    font-size: 19px; font-weight: 700; white-space: nowrap;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto;
                  font-size: 13px; color: var(--text-dim); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
              display: inline-block; box-shadow: 0 0 0 0 rgba(62,207,142,.7);
              animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(62,207,142,.6)} 70%{box-shadow:0 0 0 8px rgba(62,207,142,0)} 100%{box-shadow:0 0 0 0 rgba(62,207,142,0)} }
  button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
  .btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
         padding: 6px 12px; color: var(--text-dim); transition: all .15s; font-size: 13px;
         text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .btn:hover { color: var(--text); border-color: var(--accent); }

  main { max-width: 860px; margin: 14px auto 40px; padding: 0 24px; }

  /* ---- 概览 stat 行 ---- */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat-box .label { font-size: 12px; color: var(--text-dim); }
  .stat-box .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat-box .value.accent { color: var(--accent); }
  .stat-box .value.green { color: var(--green); }
  .stat-box .value.purple { color: var(--purple); }
  .stat-box .value.orange { color: var(--orange); }

  /* ---- 卡片 ---- */
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { font-size: 12px; font-weight: 400; color: var(--text-dim); margin-left: auto; }

  /* ---- 柱状图（纯 CSS，无第三方库）---- */
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 130px; padding-top: 8px; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: flex-end; height: 100%; position: relative; }
  .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0;
         transition: opacity .15s; min-height: 2px; }
  .bar-col:hover .bar { opacity: .8; }
  .bar-col .tip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%;
                  transform: translateX(-50%); background: var(--bg-hover); border: 1px solid var(--border);
                  border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap;
                  color: var(--text); z-index: 5; }
  .bar-col:hover .tip { display: block; }
  .chart-x { display: flex; gap: 2px; margin-top: 6px; }
  .chart-x span { flex: 1; text-align: center; font-size: 10px; color: var(--text-dim);
                  overflow: hidden; white-space: nowrap; }

  /* ---- 地域分布条形列表 ---- */
  .region-row { display: flex; align-items: center; gap: 10px; padding: 7px 0;
                border-bottom: 1px solid var(--border); }
  .region-row:last-child { border-bottom: none; }
  .region-flag { font-size: 18px; width: 22px; text-align: center; }
  .region-code { font-weight: 600; font-size: 13px; width: 60px; }
  .region-bar-wrap { flex: 1; height: 8px; background: var(--bg-hover);
                     border-radius: 4px; overflow: hidden; }
  .region-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple));
                border-radius: 4px; transition: width .3s; }
  .region-count { font-size: 13px; font-weight: 600; min-width: 50px; text-align: right; }
  .region-pct { font-size: 12px; color: var(--text-dim); min-width: 44px; text-align: right; }

  /* ---- 近期访问明细表 ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
  td { vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; }
  .country-badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; font-weight: 600;
                   background: color-mix(in srgb, var(--cyan) 14%, transparent); color: var(--cyan); }

  /* ---- 空状态 / 骨架屏 ---- */
  .empty-state { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 10px; }
  .sk { border-radius: 6px; background: linear-gradient(90deg, var(--bg-hover) 25%, var(--border) 50%, var(--bg-hover) 75%);
        background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .sk-stat { height: 70px; border-radius: var(--radius); }

  footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 12px; }

  @media (max-width: 640px) {
    header { padding: 10px 16px; }
    main { padding: 0 16px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .region-code { width: 48px; }
    .region-pct { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>📊 {{ site_name }} 流量监控</h1>
    <div class="header-right">
      <span><span class="live-dot"></span> 实时</span>
      <span id="last-update">—</span>
      <button class="btn" id="refresh-btn" title="刷新">🔄</button>
      <button class="btn" id="theme-btn" title="切换深浅色">🌙</button>
      <a class="btn" href="/admin">返回后台</a>
      <a class="btn" href="/">查看首页</a>
    </div>
  </div>
</header>

<main>
  <!-- 概览 stat 行 -->
  <div class="stats-row" id="stats-row">
    <div class="stat-box"><div class="label">今日 PV</div><div class="value accent num" id="today-pv">—</div></div>
    <div class="stat-box"><div class="label">今日独立 IP</div><div class="value green num" id="today-uv">—</div></div>
    <div class="stat-box"><div class="label">近 30 天 PV</div><div class="value purple num" id="total-pv">—</div></div>
    <div class="stat-box"><div class="label">近 30 天独立 IP</div><div class="value orange num" id="total-uv">—</div></div>
  </div>

  <!-- 每日趋势柱状图 -->
  <div class="card">
    <h2>📈 近 30 天趋势 <span class="sub" id="chart-sub"></span></h2>
    <div class="chart" id="chart"></div>
    <div class="chart-x" id="chart-x"></div>
  </div>

  <!-- IP 地域分布 -->
  <div class="card">
    <h2>🌍 IP 地域分布 <span class="sub">按独立 IP 数 · 近 30 天</span></h2>
    <div id="regions"></div>
  </div>

  <!-- 近期访问明细 -->
  <div class="card">
    <h2>🕐 近期访问明细 <span class="sub">最近 30 条</span></h2>
    <div id="recent-wrap"></div>
  </div>
</main>

<footer>
  仅监控访问量与独立 IP（含地域）· 不含广告指标 · 反代头优先 + GeoLite2 兜底
</footer>

<script>
// ==================== 主题切换（与首页同 key，跨页一致）====================
const themeBtn = document.getElementById("theme-btn");
function paintThemeBtn() {
  themeBtn.textContent = document.documentElement.dataset.theme === "light" ? "☀️" : "🌙";
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("aitw_theme", next);
  paintThemeBtn();
});
paintThemeBtn();

// ==================== 工具 ====================
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n/1e8).toFixed(1) + "亿";
  if (n >= 1e4) return (n/1e4).toFixed(1) + "万";
  return n.toLocaleString();
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// ISO 国家码 → 国旗 emoji（区域指示符拼接）
const FLAG_CACHE = {};
function flagEmoji(cc) {
  if (!cc || cc === "Unknown") return "🏳";
  cc = cc.toUpperCase();
  if (cc.length !== 2 || !/^[A-Z]{2}$/.test(cc)) return "🏳";
  if (FLAG_CACHE[cc]) return FLAG_CACHE[cc];
  const A = 0x1F1E6, base = "A".charCodeAt(0);
  const e = String.fromCodePoint(A + cc.charCodeAt(0) - base, A + cc.charCodeAt(1) - base);
  FLAG_CACHE[cc] = e;
  return e;
}

// ==================== 渲染 ====================
const chartEl = document.getElementById("chart");
const chartXEl = document.getElementById("chart-x");
const chartSub = document.getElementById("chart-sub");

function renderStats(d) {
  // 安全写入：元素可能被 skeleton() 的 innerHTML 覆盖删除，先重建结构再填值。
  // 否则 getElementById 返回 null → 抛 TypeError → 整个 load() 进 catch，
  // 所有渲染跳过，骨架屏永远留着，页面「一直加载中」。
  const row = document.getElementById("stats-row");
  const boxes = [
    { id: "today-pv",  label: "今日 PV",        cls: "accent", val: d.today_pv },
    { id: "today-uv",  label: "今日独立 IP",    cls: "green",  val: d.today_uv },
    { id: "total-pv",  label: "近 30 天 PV",    cls: "purple", val: d.total_pv },
    { id: "total-uv",  label: "近 30 天独立 IP", cls: "orange", val: d.total_uv },
  ];
  // 若任一 id 缺失（被骨架覆盖），整体重建 stats-row 结构
  const missing = boxes.some(b => !document.getElementById(b.id));
  if (missing) {
    row.innerHTML = boxes.map(b =>
      `<div class="stat-box"><div class="label">${b.label}</div>` +
      `<div class="value ${b.cls} num" id="${b.id}">—</div></div>`
    ).join("");
  }
  boxes.forEach(b => {
    const el = document.getElementById(b.id);
    if (el) el.textContent = fmtNum(b.val);
  });
}

function renderChart(daily) {
  if (!daily || !daily.length) {
    chartEl.innerHTML = '<div class="empty-state">暂无访问数据</div>';
    chartXEl.innerHTML = "";
    chartSub.textContent = "";
    return;
  }
  const maxPv = Math.max(...daily.map(x => x.pv), 1);
  // 横轴最多标 6 个日期，避免拥挤
  const step = Math.ceil(daily.length / 6);
  let bars = "", labels = "";
  daily.forEach((d, i) => {
    const h = (d.pv / maxPv * 100).toFixed(1);
    bars += `<div class="bar-col">
      <div class="bar" style="height:${h}%"></div>
      <div class="tip">${escapeHtml(d.date)} · PV ${fmtNum(d.pv)} · UV ${fmtNum(d.uv)}</div>
    </div>`;
    labels += `<span>${i % step === 0 ? d.date.slice(5) : ""}</span>`;
  });
  chartEl.innerHTML = bars;
  chartXEl.innerHTML = labels;
  chartSub.textContent = `峰值 PV ${fmtNum(maxPv)}`;
}

function renderRegions(regions) {
  const el = document.getElementById("regions");
  if (!regions || !regions.length) {
    el.innerHTML = '<div class="empty-state">暂无地域数据</div>';
    return;
  }
  // Top 15 + 「其他」合并
  const TOP = 15;
  let list = regions.slice(0, TOP);
  const rest = regions.slice(TOP);
  if (rest.length) {
    const restCount = rest.reduce((s, r) => s + r.count, 0);
    const restPct = rest.reduce((s, r) => s + r.pct, 0);
    list = list.concat([{ country: "其他", count: restCount, pct: Math.round(restPct * 10) / 10, _rest: true }]);
  }
  el.innerHTML = list.map(r => {
    const fl = r._rest ? "🗂" : flagEmoji(r.country);
    const code = escapeHtml(r.country);
    return `<div class="region-row">
      <span class="region-flag">${fl}</span>
      <span class="region-code">${code}</span>
      <div class="region-bar-wrap"><div class="region-bar" style="width:${Math.min(r.pct, 100)}%"></div></div>
      <span class="region-count num">${fmtNum(r.count)}</span>
      <span class="region-pct num">${r.pct}%</span>
    </div>`;
  }).join("");
}

function renderRecent(recent) {
  const el = document.getElementById("recent-wrap");
  if (!recent || !recent.length) {
    el.innerHTML = '<div class="empty-state">暂无访问记录</div>';
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>时间</th><th>IP</th><th>地域</th><th>路径</th></tr></thead>
    <tbody>${recent.map(r => `<tr>
      <td class="num">${escapeHtml(r.ts)}</td>
      <td class="mono">${escapeHtml(r.ip)}</td>
      <td><span class="country-badge">${flagEmoji(r.country)} ${escapeHtml(r.country)}</span></td>
      <td class="mono">${escapeHtml(r.path)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function skeleton() {
  document.getElementById("stats-row").innerHTML =
    '<div class="sk sk-stat"></div>'.repeat(4);
  document.getElementById("regions").innerHTML =
    '<div class="sk" style="height:14px;margin:7px 0"></div>'.repeat(6);
  document.getElementById("recent-wrap").innerHTML =
    '<div class="sk" style="height:14px;margin:7px 0"></div>'.repeat(8);
}

// ==================== 数据拉取 ====================
const lastUpdateEl = document.getElementById("last-update");
let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  lastUpdateEl.textContent = "加载中…";
  try {
    const res = await fetch("/monitor/api", { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    renderStats(d);
    renderChart(d.daily);
    renderRegions(d.regions);
    renderRecent(d.recent);
    lastUpdateEl.textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN");
  } catch (e) {
    lastUpdateEl.textContent = "加载失败";
  } finally {
    loading = false;
  }
}

document.getElementById("refresh-btn").addEventListener("click", load);

skeleton();
load();
// 监控需近实时，60s 自动刷新（区别于首页 6h）
setInterval(load, 60 * 1000);
</script>
</body>
</html>
