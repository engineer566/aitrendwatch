services:
  hot-aggregator:
    image: aitrendwatch:1.8.0
    container_name: aitrendwatch
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
      - ./config.py:/app/config.py:ro
      - ./store.py:/app/store.py:ro
      - ./tracker.py:/app/tracker.py:ro
      - ./dims.py:/app/dims.py:ro
      - ./news_store.py:/app/news_store.py:ro
      - ./terms.py:/app/terms.py:ro
      - ./text_utils.py:/app/text_utils.py:ro
      - ./stream_utils.py:/app/stream_utils.py:ro
      - ./templates:/app/templates:ro
      - ./vendor:/app/vendor:ro
      - ./cache:/app/cache:rw
      - ./data:/app/data:rw
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app/vendor
      - DATA_DIR=/app/data
      - CACHE_DIR=/app/cache
    # 内存优化：workers 4→2（1.6G 小内存主机，多 worker 各持一份文件缓存 + 代码，
    # 减 worker 数直接压稳态内存）。max-requests 50000 + jitter 300：回收频率压到
    # ~33h/次（避免 worker 频繁回收→启动刷新→高频 LLM 调用），保留长跑进程偶发清零。
    command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "60", "--max-requests", "50000", "--max-requests-jitter", "300", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    # 只绑 127.0.0.1，由宿主 Nginx 反代；不直接暴露公网
    ports:
      - "127.0.0.1:5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
