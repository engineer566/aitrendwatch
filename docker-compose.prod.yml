services:
  hot-aggregator:
    image: python:3.13-slim
    container_name: aitrendwatch
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
      - ./config.py:/app/config.py:ro
      - ./store.py:/app/store.py:ro
      - ./tracker.py:/app/tracker.py:ro
      - ./templates:/app/templates:ro
      - ./vendor:/app/vendor:ro
      - ./cache:/app/cache:rw
      - ./data:/app/data:rw
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app/vendor
      - DATA_DIR=/app/data
      - CACHE_DIR=/app/cache
    command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5000", "--workers", "4", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    # 只绑 127.0.0.1，由宿主 Nginx 反代；不直接暴露公网
    ports:
      - "127.0.0.1:5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
